name: Publish NuGet Packages

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Verify release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::NuGet publishing requires a release tag (vX.Y.Z or vX.Y.Z-prerelease)."
            exit 1
          fi
    
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve supported SDKs
        id: frameworks
        env:
          DOTNET_NOLOGO: '1'
        shell: bash
        run: |
          frameworks=$(dotnet msbuild src/CodeBeam.UltimateAuth.Core/CodeBeam.UltimateAuth.Core.csproj -nologo -getProperty:UltimateAuthTargetFrameworks)
          {
            echo 'sdks<<SDKS'
            IFS=';' read -ra targets <<< "$frameworks"
            for target in "${targets[@]}"; do
              echo "${target#net}.x"
            done
            echo 'SDKS'
          } >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ steps.frameworks.outputs.sdks }}

      - name: Verify package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          PROJECT_VERSION=$(dotnet msbuild \
            -getProperty:Version \
            src/CodeBeam.UltimateAuth.Server/CodeBeam.UltimateAuth.Server.csproj)

          if [[ "$TAG_VERSION" != "$PROJECT_VERSION" ]]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package version ($PROJECT_VERSION)."
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Pack (nupkg + snupkg)
        run: |
          dotnet pack -c Release \
            --no-build \
            -o ./nupkgs \
            /p:IncludeSymbols=true \
            /p:SymbolPackageFormat=snupkg

      - name: Verify packages and symbols
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=(./nupkgs/*.nupkg)

          if (( ${#packages[@]} == 0 )); then
            echo "::error::No NuGet packages were generated."
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"

          for f in "${packages[@]}"; do
            if [[ "$f" != *".$VERSION.nupkg" ]]; then
              echo "::error::Unexpected package version: $f"
              exit 1
            fi

            symbols="${f%.nupkg}.snupkg"

            if [[ ! -s "$symbols" ]]; then
              echo "::error::Missing or empty symbols package: $symbols"
              exit 1
            fi

            echo "Validated: $f + $symbols"
          done

          echo "Validated ${#packages[@]} packages and symbols."

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: CodeBeam

      - name: List packages
        run: ls -la ./nupkgs

      - name: Publish packages
        shell: bash
        run: |
          set -euo pipefail

          for f in ./nupkgs/*.nupkg; do
            echo "Publishing: $f"

            dotnet nuget push "$f" \
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Done
        run: echo "✅ NuGet publishing completed succesfully."
