name: UltimateAuth CI

on:
  push:
    branches:
      - dev
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - dev
      - 'release/**'
  workflow_dispatch:

jobs:
  build-test-coverage:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dotnet-version: ['8.0.x', '9.0.x', '10.0.x']

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🧰 Setup .NET SDK ${{ matrix.dotnet-version }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: 📦 Restore dependencies
      run: dotnet restore

    - name: 🏗️ Build
      run: dotnet build --configuration Release --no-restore

    - name: 🧪 Test with coverage
      run: |
        dotnet test \
          --configuration Release \
          --no-build \
          --filter "FullyQualifiedName!~CodeBeam.UltimateAuth.IdentityLab.Tests" \
          --collect:"XPlat Code Coverage"

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: CodeBeamOrg/UltimateAuth

  identity-lab-security:
    name: Identity Lab security (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run Identity Lab suite (including defect regressions)
        run: >-
          dotnet test tests/CodeBeam.UltimateAuth.IdentityLab.Tests
          --configuration Release
          --logger "trx;LogFileName=identity-lab.trx"
          --results-directory TestResults/IdentityLab
      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-lab-test-results
          path: TestResults/IdentityLab
