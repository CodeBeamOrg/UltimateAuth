name: Identity Lab Docker Image

on:
  pull_request:
    paths:
      - "apps/identity-lab/**"
      - "src/**"
      - "samples/**"
      - ".docker/Dockerfile.identitylab"
      - ".docker/docker-compose.identitylab.yml"
      - ".github/workflows/identitylab-image.yml"

  push:
    branches:
      - lab
    paths:
      - "apps/identity-lab/**"
      - "src/**"
      - "samples/**"
      - ".docker/Dockerfile.identitylab"
      - ".docker/docker-compose.identitylab.yml"
      - ".github/workflows/identitylab-image.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: identitylab-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Identity Lab
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile.identitylab
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/codebeamorg/ultimateauth-identitylab:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Identity Lab
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/lab'
    runs-on: ubuntu-latest
    environment: identitylab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Identity Lab Compose
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".docker/docker-compose.identitylab.yml"
          target: "/home/deploy/.identitylab-deploy/${{ github.sha }}"
          strip_components: 1

      - name: Deploy Identity Lab
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ghcr.io/codebeamorg/ultimateauth-identitylab:${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG
          command_timeout: 10m
          script: |
            SHA="${IMAGE_TAG##*:}"
            COMPOSE_SOURCE="/home/deploy/.identitylab-deploy/$SHA/docker-compose.identitylab.yml"

            sudo -n /usr/local/sbin/deploy-identitylab \
              "$IMAGE_TAG" "$COMPOSE_SOURCE"

            rm -rf -- "/home/deploy/.identitylab-deploy/$SHA"
