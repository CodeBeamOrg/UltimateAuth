name: Identity Lab Docker Image

on:
  pull_request:
    paths:
      - "apps/identity-lab/**"
      - "src/**"
      - "samples/**"
      - ".docker/Dockerfile.identitylab"
      - ".github/workflows/identitylab-image.yml"

  push:
    branches:
      - lab
    paths:
      - "apps/identity-lab/**"
      - "src/**"
      - "samples/**"
      - ".docker/Dockerfile.identitylab"
      - ".github/workflows/identitylab-image.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Identity Lab
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile.identitylab
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/codebeamorg/ultimateauth-identitylab:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
