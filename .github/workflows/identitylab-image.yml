name: Identity Lab Docker Image

on:
  push:
    branches:
      - master
    paths:
      - "apps/identity-lab/**"
      - "src/**"
      - "samples/**"
      - ".docker/Dockerfile.identitylab"
      - ".github/workflows/identitylab-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Identity Lab
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile.identitylab
          push: true
          tags: ghcr.io/codebeamorg/ultimateauth-identitylab:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
