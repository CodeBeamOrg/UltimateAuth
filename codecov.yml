comment:
  require_changes: yes

coverage:
  status:
    project:
      default: false
      framework:
        flags:
          - framework
        target: 80%
        threshold: 2%

    patch:
      default: false
      framework:
        flags:
          - framework
        target: 80%
        threshold: 10%

flags:
  framework:
    paths:
      - src/

ignore:
  - "samples/**"
  - "tests/**"
  - "apps/**"
  - "**/Migrations/**"
